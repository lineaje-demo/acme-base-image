name: Lineaje Image Scan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan"
        required: true
        default: "main"
      version:
        description: "Image version"
        required: true
        default: "v1"

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # 1. Build the original image
      - run: docker build -t acme-base-image:latest .

      # 2. Scan + fix plan → uploads patched Dockerfile artifact
      - name: Lineaje scan + fix plan
        id: scan
        uses: lineaje-actions/lineaje-actions@v1
        with:
          scan_type: image
          image: acme-base-image:latest
          metafiles: Dockerfile
          lineaje_cli_token: ${{ secrets.LINEAJE_CLI_TOKEN }}
          project_name: "acme-base-image"
          project_version: ${{ github.event.inputs.version }}
          org_name: "Root Organization"
          post_scan: fix_plan

      # 3. Rebuild only when curated fixes exist (already available as-is).
      #    Skip when premium_only=true — those fixes must be requested from
      #    Lineaje first and are not yet available to apply.
      - name: Build patched image
        if: steps.scan.outputs.premium_only == 'false' && steps.scan.outputs.fix_artifact_uploaded == 'true'
        run: |
          docker build \
            -f ${{ steps.scan.outputs.patched_dockerfile }} \
            --build-arg MY_BUILD_ARG=value \
            --secret id=mysecret,src=$HOME/.secret \
            -t acme-base-image:latest-patched \
            .

      # 4. Rescan the patched image to confirm fixes
      - name: Lineaje rescan (patched)
        if: steps.scan.outputs.premium_only == 'false' && steps.scan.outputs.fix_artifact_uploaded == 'true'
        uses: lineaje-actions/lineaje-actions@v1
        with:
          scan_type: image
          image: acme-base-image:latest-patched
          metafiles: Dockerfile
          lineaje_cli_token: ${{ secrets.LINEAJE_CLI_TOKEN }}
          project_name: "acme-base-image"
          project_version: "v1-patched"
          org_name: "Root Organization"
          post_scan: scan_only
